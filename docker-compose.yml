services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: bengaluru-demand-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  streaming:
    build:
      context: .
      dockerfile: Dockerfile.streaming
    container_name: bengaluru-demand-streaming
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_INPUT_TOPIC: ride_requests
      KAFKA_OUTPUT_TOPIC: predictions
      KAFKA_LOG_TOPIC: pipeline_logs
      STREAMING_API_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./ml_results:/app/ml_results:ro
      - ./public/data:/app/public/data:ro
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: bengaluru-demand-producer
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_INPUT_TOPIC: ride_requests
      KAFKA_LOG_TOPIC: pipeline_logs
      RIDE_DATASET_PATH: /data/rides_contextual_synthetic.csv
    volumes:
      - ./kafka_ride_producer.py:/app/kafka_ride_producer.py:ro
      - ./rides_contextual_synthetic.csv:/data/rides_contextual_synthetic.csv:ro
    depends_on:
      streaming:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: bengaluru-demand-web
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      - streaming
